<title>Photo Edition · 照片杂志</title>
<style>

height:0}.caption{color:var(--muted);font-size:2.5cqw;line-height:1.5;margin:0}.folio{position:absolute;bottom:3.2cqw;left:7.5cqw;right:7.5cqw;border-top:1px solid var(--line);padding-top:2cqw;display:flex;justify-content:space-between;font-size:2.2cqw;color:var(--muted);z-index:5}.figure{position:relative;min-height:0;overflow:hidden;background:#d7ddd3;flex:1}.figure img{width:100%;height:100%;object-fit:cover;display:block}.cover .sheet,.full .sheet{padding:0}.cover .figure,.full .figure{position:absolute;inset:0}.cover .figure:after,.full .figure:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0005,transparent 42%,#000a)}.cover .masthead{position:relative;z-index:2;color:#fff;font:600 9cqw/1 var(--serif);text-align:center;margin:7cqw 5cqw 0;overflow-wrap:anywhere}.cover .edition{position:relative;z-index:2;color:#fffd;text-align:center;font-size:2.3cqw;letter-spacing:.15em;margin:0 5cqw}.cover .covertext{position:relative;z-index:2;color:#fff;margin:auto 7.5cqw 16cqw}.cover .kicker{color:#fffd}.cover .headline{font-size:10cqw;text-shadow:0 2px 10px #0005}.cover .copy{font-size:3cqw;max-height:25cqw;margin-top:3cqw}.feature .kicker{border-top:3px solid var(--accent);padding-top:2.2cqw}.feature .headline{font-size:6.4cqw}.feature .figure{flex:1;min-height:30%}.feature .copy{max-height:29%;flex-shrink:0}.full .textblock{position:relative;z-index:2;color:#fff;margin:auto 7.5cqw 16cqw;max-height:58%;overflow:auto}.full .kicker{color:#fff}.full .headline{font-size:8.2cqw}.collage .pictures{flex:1;min-height:28%;display:grid;grid-template-columns:1.08fr .92fr;gap:3cqw}.collage .pictures .figure:first-child{margin-bottom:12cqw}.collage .pictures .figure:last-child{margin-top:12cqw}.collage .copy{max-height:28%;flex-shrink:0}.letter{justify-content:center}.letter .sheet{justify-content:center}.letter .headline{font-size:8.5cqw}.letter .copy{max-height:57%;margin-top:2cqw}.letter .figure{flex:0 1 31%;min-height:18%;margin-top:2cqw}.end{height:100%;display:grid;place-items:center;text-align:center;padding:16%;font:5cqw/1.8 var(--serif);color:var(--muted)}.end small{display:block;font:2.2cqw var(--sans);letter-spacing:.2em;margin-top:4cqw}.stage.can-grab{cursor:grab}.stage.is-dragging{cursor:grabbing;user-select:none}.leaf{position:absolute;top:0;width:50%;height:100%;z-index:10;transform-style:preserve-3d;pointer-events:none;will-change:transform}.leaf.next{left:50%;transform-origin:left center}.leaf.prev{left:0;transform-origin:right center}.single .leaf{width:100%;left:0}.single .leaf.next{transform-origin:left center}.single .leaf.prev{transform-origin:right center}.leaf .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);overflow:hidden}.leaf .face.back{transform:rotateY(180deg)}.leaf .page{width:100%;left:0}.leaf.dragging{transition:none!important}.leaf.settling{transition:transform 420ms cubic-bezier(.22,.58,.19,1)}.leaf.moving{transition:transform 700ms cubic-bezier(.22,.58,.19,1)}.leaf.moving.next{transform:rotateY(-180deg)}.leaf.moving.prev{transform:rotateY(180deg)}.reader-foot{min-height:74px;border-top:1px solid var(--line)}.hint{color:var(--muted);font-size:10px}.nav{display:flex;align-items:center;gap:14px}.arrow{border:1px solid var(--line);border-radius:50%;background:transparent;width:42px;height:42px;font-size:20px;color:var(--ink)}.arrow:disabled{opacity:.3}.meter{font-size:11px;min-width:70px;text-align:center;color:var(--muted)}.issue{color:var(--muted);font-size:10px;max-width:22%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast{position:fixed;z-index:50;bottom:95px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 18px;font-size:13px;max-width:90vw}
dialog{border:0;border-radius:16px;background:var(--paper);color:var(--ink);width:min(720px,94vw);max-height:88svh;padding:0;box-shadow:0 28px 100px #17231b55}dialog::backdrop{background:#17231baa;backdrop-filter:blur(5px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.dialog-head h2{font:600 20px var(--serif);margin:0}.edit-fields{padding:18px 22px;display:grid;gap:16px;overflow:auto}.edit-fields label{display:grid;gap:6px;font-size:12px;color:var(--muted)}.edit-fields input,.edit-fields textarea{border:1px solid var(--line);background:#fff9;border-radius:8px;padding:9px 11px;color:var(--ink)}.edit-fields textarea{min-height:100px;resize:vertical;line-height:1.6}.dialog-actions{border-top:1px solid var(--line);padding:14px 22px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.status{width:100%;font-size:12px;color:var(--muted);margin:0}.hidden{display:none!important}

<body data-style="daily">
<a class="skip-link" href="#maker">跳到制作表单</a><main class="landing" id="landing">
  <section class="hero"><div class="eyebrow">PHOTO EDITION / LOCAL FIRST</div><h1>这一期，<br><em>从你的照片开始。</em></h1><p>选不超过 20 张照片，再写几句发生过的事。生成后可以翻页、修改文字并保存成独立网页。</p><p class="hero-note">适合旅行、日常生活，或两个人的共同记录。</p></section>
  <form class="maker" id="maker">
    <h2>制作新的一期</h2>
    <div class="field"><label id="photo-label" for="files">照片 · 最多 20 张</label><div class="drop" id="drop"><strong>把照片拖到这里</strong><span>支持 JPG、PNG、WebP；照片只在当前浏览器处理</span><input id="files" name="photos" type="file" accept="image/jpeg,image/png,image/webp" aria-labelledby="photo-label" multiple><button type="button" id="choose" aria-label="选择最多 20 张照片">选择照片</button></div><div class="file-count" id="file-count" role="status" aria-live="polite" aria-atomic="true"></div></div>
    <div class="field"><label for="title">刊名</label><input id="title" name="title" type="text" autocomplete="off" maxlength="24" value="我们的日常" placeholder="给这一期起个名字…"></div>
    <fieldset class="styles"><legend>选择风格</legend><label><span class="style-name"><b>01</b><strong>日常生活</strong></span><input type="radio" name="style" value="daily" checked><small>留白多一些，短句穿插</small></label><label><span class="style-name"><b>02</b><strong>旅行特刊</strong></span><input type="radio" name="style" value="voyage"><small>大图优先，章节更利落</small></label><label><span class="style-name"><b>03</b><strong>双人故事</strong></span><input type="radio" name="style" value="duet"><small>照片并置，文字更亲近</small></label></fieldset>
    <div class="field"><label for="story">总体故事</label><textarea id="story" name="story" autocomplete="off" maxlength="900" placeholder="写下人物、地点和你想记住的细节…"></textarea></div>
    <button class="primary" id="make" type="submit" disabled>生成我的杂志</button>
    <p class="privacy"><b>隐私：</b>照片在本机缩放并取色，不会上传。杂志文字只取自你写下的故事。</p>
  </form>
</main>

<section class="reader" id="reader" aria-label="电子杂志">
  <header class="reader-head"><div class="brand"><small>THE PERSONAL EDITION</small><strong id="brand-title"></strong></div><div class="actions"><button class="quiet" id="edit">编辑文字</button><button class="quiet" id="restart">重新制作</button><button class="quiet" id="print">保存 PDF</button><button class="quiet" id="download">下载网页</button></div></header>
  <main class="reader-main"><div class="stage" id="stage" tabindex="0" role="region" aria-label="电子杂志，使用左右方向键或翻页按钮翻阅"></div></main>
  <footer class="reader-foot"><div class="hint">拖住外侧页角，跟随鼠标移动；松开完成翻页 · 方向键也可翻页</div><nav class="nav"><button class="arrow" id="prev" aria-label="上一页">←</button><span class="meter" id="meter" aria-live="polite"></span><button class="arrow" id="next" aria-label="下一页">→</button></nav><div class="issue" id="issue"></div></footer>
</section>

<dialog id="editor" aria-labelledby="editor-title"><div class="dialog-head"><h2 id="editor-title">编辑文字</h2><button class="quiet" id="close-editor">完成</button></div><div class="edit-fields" id="edit-fields"></div><div class="dialog-actions"><p class="status" id="edit-status"></p><button class="quiet" id="restore">恢复原稿</button><button class="quiet" id="save">保存到本机</button><button class="primary" id="download-edited">下载网页</button></div></dialog>
<div class="toast hidden" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id), landing=$('landing'),reader=$('reader'),drop=$('drop'),files=$('files'),make=$('make');
  let photos=[],data=window.__PHOTO_EDITION_DATA__||null,current=0,step=matchMedia('(max-width:760px)').matches?1:2,busy=false,timer=null,pointer=null,originalData=data?structuredClone(data):null;
  if(data){landing.classList.add('hidden');reader.classList.add('active');document.body.dataset.style=data.style;applyPalette(data.palette);}
  const styles={daily:{name:'日常生活',subtitle:'生活记录'},voyage:{name:'旅行特刊',subtitle:'沿途片段'},duet:{name:'双人故事',subtitle:'共同生活'}},limits={kicker:32,title:48,body:1000,caption:120};
  const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x;};
  const toast=m=>{const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),4200);};
  function showFiles(list){const accepted=[...list].filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type));if(accepted.length!==list.length)toast('已跳过不支持的文件格式。');if(accepted.length>20)toast('最多使用 20 张照片，已保留前 20 张。');photos=accepted.slice(0,20);$('file-count').textContent=photos.length?`已选择 ${photos.length} 张照片`:'还没有选择照片';make.disabled=!photos.length;}
  $('choose').onclick=()=>files.click();files.onchange=()=>showFiles(files.files);['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.ondrop=e=>showFiles(e.dataTransfer.files);
  function selectedStyle(){return document.querySelector('input[name=style]:checked').value;}
  function imageTone(ctx,c){const pixels=ctx.getImageData(0,0,c.width,c.height).data,step=Math.max(1,Math.floor(Math.sqrt(c.width*c.height/420))),bins=Array.from({length:24},()=>({weight:0,hue:0,sat:0,count:0}));for(let y=Math.floor(step/2);y<c.height;y+=step){for(let x=Math.floor(step/2);x<c.width;x+=step){const i=(y*c.width+x)*4,r=pixels[i]/255,g=pixels[i+1]/255,b=pixels[i+2]/255,max=Math.max(r,g,b),min=Math.min(r,g,b),delta=max-min,light=(max+min)/2,sat=max?delta/max:0;if(sat<.16||light<.12||light>.9)continue;let hue=0;if(delta){if(max===r)hue=60*(((g-b)/delta)%6);else if(max===g)hue=60*((b-r)/delta+2);else hue=60*((r-g)/delta+4);}hue=(hue+360)%360;const bin=bins[Math.floor(hue/15)%24],weight=sat;bin.weight+=weight;bin.hue+=hue*weight;bin.sat+=sat*weight;bin.count++;}}const best=bins.reduce((a,b)=>b.weight>a.weight?b:a,bins[0]);return best.weight?{hue:best.hue/best.weight,saturation:best.sat/best.weight}:{hue:38,saturation:.12};}

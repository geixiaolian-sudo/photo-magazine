<title>Photo Edition · 照片杂志</title>
<style>

.landing{min-height:100svh;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);gap:clamp(28px,6vw,100px);align-items:center;width:min(1240px,100%);margin:auto;padding:clamp(26px,6vw,82px)}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.25em;font-weight:700}.hero h1{font:600 clamp(54px,8vw,112px)/.9 var(--serif);letter-spacing:-.06em;margin:20px 0 24px;max-width:720px}.hero h1 em{font-weight:400;color:var(--accent);font-style:normal}.hero p{max-width:610px;font:clamp(17px,2.2vw,25px)/1.65 var(--serif);margin:0;color:#304238}.hero-note{color:var(--muted)!important;font:13px/1.8 var(--sans)!important;margin-top:22px!important}.maker{background:color-mix(in srgb,var(--paper) 92%,white);border:1px solid var(--line);box-shadow:0 28px 70px #1e2b2518;border-radius:22px;padding:clamp(20px,3vw,36px);display:grid;gap:22px}.maker h2{font:600 25px var(--serif);margin:0}.field{display:grid;gap:8px}.field label,.field legend{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}.field input[type=text],.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff9;color:var(--ink)}.field textarea{min-height:115px;resize:vertical;line-height:1.7}.drop{border:1px dashed #4a745d77;border-radius:13px;padding:20px;text-align:center;background:#4a745d0b;transition:.2s}.drop.drag{background:#4a745d1a;border-color:var(--accent)}.drop strong{display:block;font-size:14px}.drop span{display:block;color:var(--muted);font-size:12px;margin-top:6px}.drop input{display:none}.drop button{margin-top:13px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:100px;padding:8px 14px;font-size:12px}.file-count{font-size:12px;color:var(--accent);min-height:18px}.styles{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.styles label{display:grid;gap:4px;border:1px solid var(--line);border-radius:10px;padding:11px 8px;cursor:pointer;font-size:12px}.styles input{accent-color:var(--accent)}.styles label:has(input:checked){border-color:var(--accent);background:#4a745d13}.styles small{color:var(--muted);font-size:10px;line-height:1.4}.primary{border:0;border-radius:100px;background:var(--ink);color:var(--paper);padding:14px 18px;font-weight:700;letter-spacing:.04em}.primary:disabled{opacity:.35;cursor:not-allowed}.privacy{font-size:11px;line-height:1.6;color:var(--muted);margin:0}.privacy b{color:var(--ink)}
.reader{display:none;min-height:100svh;height:100svh;overflow:hidden;padding:0 max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom))}.reader.active{display:flex;flex-direction:column}.reader-head,.reader-foot{width:min(1200px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.reader-head{min-height:74px;border-bottom:1px solid var(--line)}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.25em;margin-bottom:5px}.brand strong{font-size:15px;letter-spacing:.1em}.actions{display:flex;gap:8px}.quiet{border:1px solid var(--line);border-radius:100px;background:transparent;padding:8px 13px;color:var(--ink);font-size:12px}.quiet:hover{background:#fff7}.reader-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px 8px 18px}.stage{position:relative;width:min(100%,1080px);height:min(78svh,720px);perspective:2100px;filter:drop-shadow(0 22px 24px #17231b2b);isolation:isolate;touch-action:pan-y;outline:none}.stage.single{width:min(100%,540px)}.page{position:absolute;top:0;width:50%;height:100%;background:var(--paper);overflow:hidden;color:var(--ink)}.page.left{left:0}.page.right{left:50%}.single .page{width:100%;left:0}.page:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;background:linear-gradient(90deg,#17231b12,transparent 19%,transparent 78%,#17231b12)}.sheet{height:100%;position:relative;padding:7.5cqw 7.5cqw 9cqw;display:flex;flex-direction:column;gap:3.2cqw;container-type:inline-size}.kicker{font-size:2.5cqw;line-height:1.5;letter-spacing:.18em;color:var(--accent)}.headline{font:600 7.5cqw/1.2 var(--serif);margin:0;white-space:pre-line;overflow-wrap:anywhere}.copy{font:clamp(12px,3.1cqw,17px)/1.82 var(--sans);margin:0;white-space:pre-line;overflow:auto;min-height:0}.caption{color:var(--muted);font-size:2.5cqw;line-height:1.5;margin:0}.folio{position:absolute;bottom:3.2cqw;left:7.5cqw;right:7.5cqw;border-top:1px solid var(--line);padding-top:2cqw;display:flex;justify-content:space-between;font-size:2.2cqw;color:var(--muted);z-index:5}.figure{position:relative;min-height:0;overflow:hidden;background:#d7ddd3;flex:1}.figure img{width:100%;height:100%;object-fit:cover;display:block}.cover .sheet,.full .sheet{padding:0}.cover .figure,.full .figure{position:absolute;inset:0}.cover .figure:after,.full .figure:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0005,transparent 42%,#000a)}.cover .masthead{position:relative;z-index:2;color:#fff;font:600 9cqw/1 var(--serif);text-align:center;margin:7cqw 5cqw 0;overflow-wrap:anywhere}.cover .edition{position:relative;z-index:2;color:#fffd;text-align:center;font-size:2.3cqw;letter-spacing:.15em;margin:0 5cqw}.cover .covertext{position:relative;z-index:2;color:#fff;margin:auto 7.5cqw 16cqw}.cover .kicker{color:#fffd}.cover .headline{font-size:10cqw;text-shadow:0 2px 10px #0005}.cover .copy{font-size:3cqw;max-height:25cqw;margin-top:3cqw}.feature .kicker{border-top:3px solid var(--accent);padding-top:2.2cqw}.feature .headline{font-size:6.4cqw}.feature .figure{flex:1;min-height:30%}.feature .copy{max-height:29%;flex-shrink:0}.full .textblock{position:relative;z-index:2;color:#fff;margin:auto 7.5cqw 16cqw;max-height:58%;overflow:auto}.full .kicker{color:#fff}.full .headline{font-size:8.2cqw}.collage .pictures{flex:1;min-height:28%;display:grid;grid-template-columns:1.08fr .92fr;gap:3cqw}.collage .pictures .figure:first-child{margin-bottom:12cqw}.collage .pictures .figure:last-child{margin-top:12cqw}.collage .copy{max-height:28%;flex-shrink:0}.letter{justify-content:center}.letter .sheet{justify-content:center}.letter .headline{font-size:8.5cqw}.letter .copy{max-height:57%;margin-top:2cqw}.letter .figure{flex:0 1 31%;min-height:18%;margin-top:2cqw}.end{height:100%;display:grid;place-items:center;text-align:center;padding:16%;font:5cqw/1.8 var(--serif);color:var(--muted)}.end small{display:block;font:2.2cqw var(--sans);letter-spacing:.2em;margin-top:4cqw}.leaf{position:absolute;top:0;width:50%;height:100%;z-index:10;transform-style:preserve-3d;pointer-events:none;will-change:transform}.leaf.next{left:50%;transform-origin:left center}.leaf.prev{left:0;transform-origin:right center}.leaf .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);overflow:hidden}.leaf .face.back{transform:rotateY(180deg)}.leaf .page{width:100%;left:0}.leaf.moving{transition:transform 700ms cubic-bezier(.22,.58,.19,1)}.leaf.moving.next{transform:rotateY(-180deg)}.leaf.moving.prev{transform:rotateY(180deg)}.reader-foot{min-height:74px;border-top:1px solid var(--line)}.hint{color:var(--muted);font-size:10px}.nav{display:flex;align-items:center;gap:14px}.arrow{border:1px solid var(--line);border-radius:50%;background:transparent;width:42px;height:42px;font-size:20px;color:var(--ink)}.arrow:disabled{opacity:.3}.meter{font-size:11px;min-width:70px;text-align:center;color:var(--muted)}.issue{color:var(--muted);font-size:10px;max-width:22%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast{position:fixed;z-index:50;bottom:95px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 18px;font-size:13px;max-width:90vw}
dialog{border:0;border-radius:16px;background:var(--paper);color:var(--ink);width:min(720px,94vw);max-height:88svh;padding:0;box-shadow:0 28px 100px #17231b55}dialog::backdrop{background:#17231baa;backdrop-filter:blur(5px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.dialog-head h2{font:600 20px var(--serif);margin:0}.edit-fields{padding:18px 22px;display:grid;gap:16px;overflow:auto}.edit-fields label{display:grid;gap:6px;font-size:12px;color:var(--muted)}.edit-fields input,.edit-fields textarea{border:1px solid var(--line);background:#fff9;border-radius:8px;padding:9px 11px;color:var(--ink)}.edit-fields textarea{min-height:100px;resize:vertical;line-height:1.6}.dialog-actions{border-top:1px solid var(--line);padding:14px 22px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.status{width:100%;font-size:12px;color:var(--muted);margin:0}.hidden{display:none!important}
@media(max-width:760px){.landing{display:block;padding:25px 18px}.hero{margin:16px 0 30px}.hero h1{font-size:63px}.hero p{font-size:18px}.maker{padding:20px 16px}.styles{grid-template-columns:1fr}.reader{padding-inline:10px}.reader-head{min-height:65px}.brand strong{font-size:12px}.quiet{padding:8px 10px;font-size:11px}.reader-main{padding:18px 0 14px}.stage{width:100%;height:min(76svh,730px)}.reader-foot{min-height:72px;justify-content:center}.hint,.issue{display:none}.nav{width:100%;justify-content:space-between;padding:0 16px}.copy{font-size:clamp(12px,3.6cqw,16px)}.folio{font-size:2.6cqw}.caption{font-size:2.8cqw}}
@media(prefers-reduced-motion:reduce){.leaf.moving{transition:none}}
@media print{.landing{display:none!important}.reader{display:flex!important;height:auto;min-height:0;overflow:visible}.reader-head,.reader-foot{display:none!important}.reader-main{padding:0}.stage{width:180mm!important;height:auto!important;display:block;filter:none;perspective:none}.stage .page{position:relative!important;inset:auto!important;width:180mm!important;height:250mm!important;break-after:page}.stage .page:last-child{break-after:auto}}
</style>
</head>
<body data-style="daily">
<main class="landing" id="landing">
  <section class="hero"><div class="eyebrow">PHOTO EDITION / LOCAL FIRST</div><h1>把生活<br><em>编成一本杂志。</em></h1><p>上传最多 20 张照片，写下一段故事。所有处理都在浏览器里完成，生成可以翻页、编辑和保存的中文电子杂志。</p><p class="hero-note">适合旅行、日常生活和两个人的共同记录。照片不会上传到服务器。</p></section>
  <form class="maker" id="maker">
    <h2>制作新的一期</h2>
    <div class="field"><label>照片 · 最多 20 张</label><div class="drop" id="drop"><strong>把照片拖到这里</strong><span>支持 JPG、PNG、WebP；照片只在当前浏览器处理</span><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple><button type="button" id="choose">选择照片</button></div><div class="file-count" id="file-count"></div></div>
    <div class="field"><label for="title">刊名</label><input id="title" type="text" maxlength="24" value="我们的日常" placeholder="例如：暖菊"></div>
    <fieldset class="styles"><legend>选择风格</legend><label><input type="radio" name="style" value="daily" checked> 日常生活<small>奶白、深绿、轻松拼贴</small></label><label><input type="radio" name="style" value="voyage"> 旅行特刊<small>暖白、砖红、编辑式图文</small></label><label><input type="radio" name="style" value="duet"> 双人故事<small>淡粉、酒红、柔和叙事</small></label></fieldset>
    <div class="field"><label for="story">总体故事</label><textarea id="story" maxlength="900" placeholder="去了哪里、和谁一起、最难忘的小事，以及想留下的感受……"></textarea></div>
    <button class="primary" id="make" type="submit" disabled>生成我的杂志</button>
    <p class="privacy"><b>隐私：</b>本网站是纯静态页面，照片通过浏览器 File API 和 Canvas 在本机缩放，不会自动上传。刷新页面后，未导出的内容会消失。</p>
  </form>
</main>

<section class="reader" id="reader" aria-label="电子杂志">
  <header class="reader-head"><div class="brand"><small>THE PERSONAL EDITION</small><strong id="brand-title"></strong></div><div class="actions"><button class="quiet" id="edit">编辑文字</button><button class="quiet" id="restart">重新制作</button><button class="quiet" id="print">保存 PDF</button><button class="quiet" id="download">下载网页</button></div></header>
  <main class="reader-main"><div class="stage" id="stage" tabindex="0" role="region" aria-label="电子杂志，使用左右方向键或翻页按钮翻阅"></div></main>
  <footer class="reader-foot"><div class="hint">点击页边或左右滑动 · 方向键翻页</div><nav class="nav"><button class="arrow" id="prev" aria-label="上一页">←</button><span class="meter" id="meter" aria-live="polite"></span><button class="arrow" id="next" aria-label="下一页">→</button></nav><div class="issue" id="issue"></div></footer>
</section>

<dialog id="editor"><div class="dialog-head"><h2>编辑文字</h2><button class="quiet" id="close-editor">完成</button></div><div class="edit-fields" id="edit-fields"></div><div class="dialog-actions"><p class="status" id="edit-status"></p><button class="quiet" id="restore">恢复原稿</button><button class="quiet" id="save">保存到本机</button><button class="primary" id="download-edited">下载网页</button></div></dialog>
<div class="toast hidden" id="toast"></div>

<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id), landing=$('landing'),reader=$('reader'),drop=$('drop'),files=$('files'),make=$('make');
  let photos=[],data=window.__PHOTO_EDITION_DATA__||null,current=0,step=matchMedia('(max-width:760px)').matches?1:2,busy=false,timer=null,pointer=null,originalData=data?structuredClone(data):null;
  if(data){landing.classList.add('hidden');reader.classList.add('active');document.body.dataset.style=data.style;}
  const styles={daily:{name:'日常生活',subtitle:'我们的日常切片'},voyage:{name:'旅行特刊',subtitle:'沿途的风景与故事'},duet:{name:'双人故事',subtitle:'共同生活的一页'}},limits={kicker:28,title:32,body:260,caption:90};
  const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x;};
  const toast=m=>{const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),4200);};
  function showFiles(list){const accepted=[...list].filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type));if(accepted.length!==list.length)toast('已跳过不支持的文件格式。');if(accepted.length>20)toast('最多使用 20 张照片，已保留前 20 张。');photos=accepted.slice(0,20);$('file-count').textContent=photos.length?`已选择 ${photos.length} 张照片`:'还没有选择照片';make.disabled=!photos.length;}
  $('choose').onclick=()=>files.click();files.onchange=()=>showFiles(files.files);['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.ondrop=e=>showFiles(e.dataTransfer.files);
  function selectedStyle(){return document.querySelector('input[name=style]:checked').value;}
  function readImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);resolve({src:c.toDataURL('image/jpeg',.86),alt:`照片 ${photos.indexOf(file)+1}`,position:'50% 50%'});};img.onerror=reject;img.src=r.result;};r.onerror=reject;r.readAsDataURL(file);});}
  function buildData(images){const style=selectedStyle(),title=$('title').value.trim()||'我们的日常',story=$('story').value.trim()||'把这些照片留下，就是把这一段日子轻轻保存下来。';const p=images.map((x,i)=>({...x,id:'p'+String(i+1).padStart(2,'0')}));const pages=[{layout:'cover',kicker:styles[style].name,title,body:story.slice(0,100),photos:[p[0].id]},{layout:'letter',kicker:'卷首 / 写给这段日子',title:'从今天开始，\n把生活分享给你',body:story,photos:[]}];for(let i=1;i<p.length;i+=2){const pair=p.slice(i,i+2);if(pair.length===2)pages.push({layout:'collage',kicker:`${String(Math.floor(i/2)+1).padStart(2,'0')} / 生活切片`,title:'一个值得留下的瞬间',body:story.slice(0,230),caption:'照片会把这一刻留在这里。',photos:pair.map(x=>x.id)});else pages.push({layout:'feature',kicker:`${String(Math.floor(i/2)+1).padStart(2,'0')} / 生活切片`,title:'把这一页交给照片',body:story.slice(0,230),caption:'来自这次记录的一张照片。',photos:[pair[0].id]});}pages.push({layout:'letter',kicker:'写在最后 / 未完待续',title:'下一张照片，\n继续我们的故事',body:'生活还在继续，故事也还会有下一页。',caption:'保留这本杂志，也保留下一次分享的空间。',photos:[p[p.length-1].id]});return{id:'local-'+Date.now(),title,subtitle:styles[style].subtitle,issue:`${styles[style].name} · 私人珍藏`,style,photos:p,pages};}
  $('maker').onsubmit=async e=>{e.preventDefault();if(!photos.length)return;make.disabled=true;make.textContent='正在整理照片…';try{const images=[];for(const f of photos)images.push(await readImage(f));data=buildData(images);originalData=structuredClone(data);landing.classList.add('hidden');reader.classList.add('active');document.body.dataset.style=data.style;render();toast('杂志已生成，照片仍只在当前浏览器里。');}catch{toast('有照片无法读取，请换用 JPG、PNG 或 WebP。');}finally{make.textContent='生成我的杂志';make.disabled=false;}};
  function photo(id){return data.photos.find(x=>x.id===id)}
  function figure(id){const f=photo(id),box=el('figure','figure'),img=el('img');img.src=f.src;img.alt=f.alt;img.style.objectPosition=f.position;box.append(img);return box;}
  function page(index,side){const out=el('article','page '+side);if(index>=data.pages.length){const e=el('div','end');e.append(el('div','',data.title),el('small','',data.subtitle));out.append(e);return out;}const p=data.pages[index];out.classList.add(p.layout);out.setAttribute('aria-label',`第 ${index+1} 页：${p.title}`);const sheet=el('div','sheet'),k=el('div','kicker',p.kicker),h=el('h2','headline',p.title),b=el('p','copy',p.body),c=el('p','caption',p.caption);if(p.layout==='cover'){sheet.append(figure(p.photos[0]),el('div','masthead',data.title),el('div','edition',data.issue));const box=el('div','covertext');box.append(k,h,b);sheet.append(box);}else if(p.layout==='full'){sheet.append(figure(p.photos[0]));const box=el('div','textblock');box.append(k,h,b);sheet.append(box);}else if(p.layout==='collage'){const pics=el('div','pictures');p.photos.forEach(id=>pics.append(figure(id)));sheet.append(k,h,pics,b,c);}else{sheet.append(k,h);if(p.photos.length)sheet.append(figure(p.photos[0]));sheet.append(c,b);}const folio=el('div','folio');folio.append(el('span','',data.subtitle),el('span','',String(index+1).padStart(2,'0')));sheet.append(folio);out.append(sheet);return out;}
  function render(){if(busy)return;$('brand-title').textContent=data.title;$('issue').textContent=data.issue;const nextStep=matchMedia('(max-width:760px)').matches?1:2;if(nextStep!==step){step=nextStep;current=Math.floor(current/step)*step;}current=Math.max(0,Math.min(current,data.pages.length-step));$('stage').classList.toggle('single',step===1);$('stage').replaceChildren(page(current,'left'),...(step===2?[page(current+1,'right')]:[]));$('meter').textContent=`${current+1}${step===2&&current+1<data.pages.length?'–'+(current+2):''} / ${data.pages.length}`;$('prev').disabled=current===0;$('next').disabled=current+step>=data.pages.length;}
  function turn(dir){if(busy)return;const target=current+dir*step;if(target<0||target>=data.pages.length)return;if(matchMedia('(prefers-reduced-motion:reduce)').matches){current=target;render();return;}busy=true;const leaf=el('div','leaf '+(dir>0?'next':'prev')),front=el('div','face front'),back=el('div','face back');if(step===2){$('stage').replaceChildren(page(dir>0?current:target,'left'),page(dir>0?target+1:current+1,'right'));front.append(page(dir>0?current+1:current,'left'));back.append(page(dir>0?target:target+1,'left'));}else{front.append(page(current,'left'));back.append(page(target,'left'));}leaf.append(front,back);$('stage').append(leaf);leaf.getBoundingClientRect();leaf.classList.add('moving');timer=setTimeout(()=>{current=target;busy=false;render();},730);}
  $('prev').onclick=()=>turn(-1);$('next').onclick=()=>turn(1);document.onkeydown=e=>{if($('editor').open||e.target.closest('input,textarea,button'))return;if(e.key==='ArrowLeft')turn(-1);if(e.key==='ArrowRight')turn(1)};
  $('stage').onpointerdown=e=>{if(busy)return;pointer={x:e.clientX,y:e.clientY};};$('stage').onpointerup=e=>{if(!pointer)return;const dx=e.clientX-pointer.x;pointer=null;if(Math.abs(dx)>45)turn(dx<0?1:-1);};
  function fillEditor(){const root=$('edit-fields');root.replaceChildren();const all=[['刊名',data,'title',24],['副标题',data,'subtitle',50],['期号',data,'issue',32]];all.forEach(([label,obj,key,max])=>{const l=el('label','',label);const i=el('input');i.value=obj[key]||'';i.maxLength=max;i.oninput=()=>{obj[key]=i.value;render()};l.append(i);root.append(l)});data.pages.forEach((p,idx)=>{const h=el('div','',`第 ${idx+1} 页`);h.style.cssText='font-weight:700;font-size:13px;margin-top:8px';root.append(h);['kicker','title','body','caption'].forEach(key=>{const l=el('label','',key==='kicker'?'栏目':key==='title'?'标题':key==='body'?'正文':'图注');const i=el(key==='body'?'textarea':'input');i.value=p[key]||'';i.maxLength=limits[key]||90;i.oninput=()=>{p[key]=i.value;render()};l.append(i);root.append(l)})})}
  $('edit').onclick=()=>{fillEditor();$('editor').showModal()};$('close-editor').onclick=()=>$('editor').close();$('save').onclick=()=>{try{localStorage.setItem('photo-edition-draft',JSON.stringify(data));$('edit-status').textContent='已保存到本机浏览器。';}catch{$('edit-status').textContent='当前浏览器不允许本机保存。'}};$('restore').onclick=()=>{data=structuredClone(originalData);fillEditor();render();$('edit-status').textContent='已恢复原稿。'};
  $('print').onclick=()=>window.print();
  function downloadHtml(){const copy=document.documentElement.cloneNode(true);copy.querySelector('#landing')?.remove();copy.querySelector('#editor')?.remove();copy.querySelector('#toast')?.remove();copy.querySelector('#stage').replaceChildren(...data.pages.map((_,i)=>page(i,'left')));copy.querySelector('#reader').classList.add('active');copy.querySelector('#reader').style.display='flex';copy.querySelector('#reader').style.height='100svh';const script=copy.querySelector('script:last-of-type');const dataScript=document.createElement('script');dataScript.textContent='window.__PHOTO_EDITION_DATA__='+JSON.stringify(data).replace(/</g,'\u003c')+';';copy.querySelector('body').prepend(dataScript);const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(data.title||'photo-edition')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('已下载独立网页。');}
  $('download').onclick=downloadHtml;$('download-edited').onclick=()=>{downloadHtml();$('editor').close()};$('restart').onclick=()=>{if(!confirm('重新制作会清除当前这一期的浏览器内内容，确定继续吗？'))return;reader.classList.remove('active');landing.classList.remove('hidden');photos=[];data=null;$('file-count').textContent='';make.disabled=true;};
  if(data)render();
})();
